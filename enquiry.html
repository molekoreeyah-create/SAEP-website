        <section>
        <body>
            <form id="enquiry-form" novalidate>
                <fieldset class="field">
                    <legend>What would you like to enquire about?</legend>
                    <label><input type="radio" name="type" value="service"> A Service </label>
                    <label><input type="radio" name="type" value="volunteer"> Volunteering </label>
                    <label><input type="radio" name="type" value="sponser"> Sponsership </label>
                    <span class="error" role="alert"></span>
                </fieldset>
                     <div class="field"><label for="e-name">Full name</label> 
                    <input type="text" id="e-name" name="name"><span class="error" role="alert"></span></div>
                    <div class="field"><label for="e-name">Email address</label> 
                    <input type="text" id="e-email" name="email"><span class="error" role="alert"></span></div>

                     <div class="conditional" id="sec-service">
                        <div class="field"><label for="e-grade">Learner's grade (0 = Grade R)</label>
                         <input type="number" id="e-grade" min="0" max="12"><span class="error" role="alert"></span></div>

                    <div class="conditional" id="sec-volunteer">
                        <div class="field"><label for="e-hours">Hours per week (2-20)</label>
                         <input type="number" id="e-hours" min="2" max="20"><span class="error" role="alert"></span></div>

                    <div class="conditional" id="sec-sponser">  
                        <div class="field"><label for="e-amount">Monthly pledge in Rands (min 50)</label>
                          <input type="number" id="e-amount" min="50"><span class="error" role="alert"></span></div>
                   </div>
                    
                   <button class="btn btn-dark" type="submit">Send enquiry</button>
            </form>
            <div id="enquiry-result" aria-live="polite"></div>
        </section>
